<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Home</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --text:#f5f7fb; --muted:rgba(240,244,252,.72); --accent:#f2c36b; --glass:rgba(10,14,22,.46); --line:rgba(255,255,255,.14); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#0a0d14; color:var(--text);
    font-family:"Outfit","SamsungOne",Arial,sans-serif; cursor:none; }
  #wall { position:fixed; inset:0; background-size:cover; background-position:center top; opacity:0; transition:opacity 1.2s; filter:brightness(.82); }
  #wall.on { opacity:1; }
  #shade { position:fixed; inset:0;
    background:
      linear-gradient(90deg, rgba(5,8,14,.86) 0%, rgba(5,8,14,.62) 26%, rgba(5,8,14,0) 46%),
      linear-gradient(180deg, rgba(5,8,14,0) 46%, rgba(5,8,14,.78) 66%, rgba(5,8,14,.96) 100%); }
  #stage { position:relative; z-index:1; height:1080px; padding:44px 80px 22px; display:flex; flex-direction:column; }

  #top { display:flex; flex-direction:column; width:520px; }
  #time { font-size:128px; font-weight:300; line-height:1; letter-spacing:-2px; }
  #date { font-size:32px; color:var(--muted); margin-top:6px; }
  #hijri { font-size:24px; color:var(--muted); margin-top:2px; }
  #greet { font-size:32px; color:var(--accent); margin-top:8px; font-weight:500; }
  #weather { font-size:28px; margin-top:8px; color:var(--text); }
  #prayers { margin-top:18px; background:var(--glass); border:1px solid var(--line); border-radius:20px; padding:8px 18px; width:430px; }
  .pr { display:flex; justify-content:space-between; font-size:26px; padding:5px 4px; color:var(--muted); }
  .pr .t { color:var(--text); font-weight:500; }
  .pr.next { color:var(--accent); }
  .pr.next .t { color:var(--accent); }
  .pr .left { font-size:20px; margin-left:10px; opacity:.9; }

  #rows { flex:1; overflow:hidden; position:relative; margin:0 -40px; padding:22px 40px 0; }
  #scroller { transition:transform .25s ease-out; }
  .row { margin-bottom:26px; }
  .row h2 { font-size:26px; font-weight:500; color:var(--muted); margin:0 4px 14px; letter-spacing:.5px; }
  .tiles { display:flex; flex-wrap:wrap; gap:22px; }
  .tile { position:relative; border-radius:20px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:transform .15s ease-out, box-shadow .15s ease-out; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .fav .tile { width:270px; height:160px; }
  .all .tile { width:196px; height:118px; }
  .tile.hasicon { background:#fff !important; }
  .tile img { width:100%; height:100%; object-fit:cover; }
  .tile.logo img { width:46%; height:auto; object-fit:contain; margin-bottom:14px; }
  .tile.hasicon.logo .name { display:block; color:#222; }
  .tile .letter { font-size:56px; font-weight:600; color:#fff; margin-bottom:22px; font-family:Arial,sans-serif; }
  .all .tile .letter { font-size:42px; margin-bottom:18px; }
  .tile .name { position:absolute; bottom:9px; left:10px; right:10px; text-align:center; font-size:21px; font-weight:500;
    color:rgba(255,255,255,.95); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.hasicon .name { display:none; }
  .tile .star { position:absolute; top:8px; right:10px; font-size:20px; color:var(--accent); text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .tile.focused { transform:scale(1.09); box-shadow:0 0 0 5px #fff, 0 20px 50px rgba(0,0,0,.6); z-index:2; }
  #label { position:absolute; font-size:22px; font-weight:500; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.8); pointer-events:none; white-space:nowrap; display:none; z-index:3; }

  footer { display:flex; justify-content:space-between; font-size:20px; color:var(--muted); padding-top:6px; }
  #diag { font-size:15px; opacity:.45; }
  #toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(16,20,30,.95); padding:16px 36px;
    border-radius:16px; font-size:26px; opacity:0; transition:opacity .2s; z-index:10; }
  #toast.show { opacity:1; }
  #empty { font-size:24px; color:var(--muted); }
</style>
</head>
<body>
<div id="wall"></div><div id="shade"></div>
<div id="stage">
  <div id="top">
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="hijri"></div>
    <div id="greet"></div>
    <div id="weather"></div>
    <div id="prayers"></div>
  </div>
  <div id="rows"><div id="scroller">
    <section class="row fav"><h2>Favorites</h2><div class="tiles" id="favTiles"></div></section>
    <section class="row all"><h2>All apps</h2><div class="tiles" id="allTiles"></div></section>
  </div><div id="label"></div></div>
  <footer><span>OK open · Hold OK add/remove favorite · Back hide</span><span id="diag"></span></footer>
</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ================= settings ================= */
  var CITY = { name: 'Dubai', country: 'AE', lat: 25.2048, lon: 55.2708, method: 16 };
  var BG_URL = 'https://gist.githubusercontent.com/amrelkamhawy/c48bc87aa75fab3432fd8b53535c4275/raw/bg.txt';
  var BG_KEY = 'amrhome.bg.v1';
  var SVC = 'http://127.0.0.1:8085';
  var FAV_KEY = 'amrhome.favs.v3';
  var DEFAULT_FAVS = ['youtube (no ads)', 'netflix', 'shahid', 'iptv', 'playstation', 'prime', 'yango', 'disney', 'apple tv'];
  var HIDE = /^(TizenBrew|TizenBrewNextGeneration|Home|Web Browser Service|Samsung Promotion|e-Manual|SmartThings|Samsung Health|Universal Guide|Bixby|Alexa|Google Assistant|Samsung Account|Settings|Source|Sources|Media Player|Gallery Service|.*Service|.*Widget)$/i;
  var KNOWN = [
    { name: 'Netflix', ids: ['3201907018807', '11101200001'] },
    { name: 'YouTube', ids: ['111299001912'] },
    { name: 'Prime Video', ids: ['3201910019365', '3201512006785'] },
    { name: 'Disney+', ids: ['3201901017640'] },
    { name: 'Apple TV', ids: ['3201807016597'] },
    { name: 'Spotify', ids: ['3201606009684'] }
  ];
  var BRAND = [
    [/netflix/i, '#e50914', 'N'], [/youtube/i, '#ff0033', '▶'], [/shahid|mbc/i, '#12b394', 'S'],
    [/prime/i, '#00a8e1', 'P'], [/disney/i, '#113ccf', 'D+'], [/apple/i, '#2a2a2e', 'tv'],
    [/spotify/i, '#1db954', 'S'], [/osn/i, '#14306e', 'OSN'], [/starz/i, '#1b1b1b', 'S'], [/iptv/i, '#1d3fd6', 'TV'],
    [/playstation|ps /i, '#0070d1', 'PS'], [/yango/i, '#7b2ff7', 'Y'], [/internet|browser/i, '#3b6fd8', 'www']
  ];

  var LOGOS = [[/youtube/i, 'youtube.com'], [/netflix/i, 'netflix.com'], [/prime/i, 'primevideo.com'], [/disney/i, 'disneyplus.com'],
    [/apple tv/i, 'tv.apple.com'], [/spotify/i, 'spotify.com'], [/playstation/i, 'playstation.com'], [/osn/i, 'osnplus.com'], [/starz/i, 'starzplay.com']];
  function logoFor(name) { for (var i = 0; i < LOGOS.length; i++) if (LOGOS[i][0].test(name)) return 'https://www.google.com/s2/favicons?domain=' + LOGOS[i][1] + '&sz=256'; return ''; }

  /* ================= helpers ================= */
  function $(id) { return document.getElementById(id); }
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.className = 'show'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = ''; }, 2200); }
  var diagParts = {};
  function diag(k, v) { diagParts[k] = v; var s = []; for (var x in diagParts) s.push(x + ':' + diagParts[x]); $('diag').textContent = s.join(' · '); }
  function brandOf(name) {
    for (var i = 0; i < BRAND.length; i++) if (BRAND[i][0].test(name)) return BRAND[i];
    var h = 0; for (var j = 0; j < name.length; j++) h = (h * 31 + name.charCodeAt(j)) % 360;
    return [null, 'hsl(' + h + ',45%,34%)', name.charAt(0).toUpperCase()];
  }
  function req(url, ok, fail, asText) {
    var x = new XMLHttpRequest(); x.open('GET', url); x.timeout = 12000;
    x.onload = function () { if (x.status !== 200) return fail && fail(x.status); try { ok(asText ? x.responseText : JSON.parse(x.responseText)); } catch (e) { if (fail) fail(e); } };
    x.onerror = x.ontimeout = function () { if (fail) fail('net'); };
    x.send();
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt12(h, m) { return (h % 12 || 12) + ':' + pad(m) + (h < 12 ? ' AM' : ' PM'); }

  /* ================= wallpaper (fixed photo, cached on the TV) ================= */
  function showWall(src) { $('wall').style.backgroundImage = 'url(' + src + ')'; $('wall').className = 'on'; }
  (function () {
    var cached = null; try { cached = localStorage.getItem(BG_KEY); } catch (e) {}
    if (cached) return showWall(cached);
    req(BG_URL, function (txt) {
      txt = txt.replace(/\s+/g, '');
      if (txt.indexOf('data:image') === 0) { try { localStorage.setItem(BG_KEY, txt); } catch (e) {} showWall(txt); }
    }, function () { showWall('https://picsum.photos/seed/amrhome/1920/1080'); }, true);
  })();

  /* ================= clock / date ================= */
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $('time').textContent = (h % 12 || 12) + ':' + pad(m);
    $('date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    $('greet').textContent = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    renderPrayers();
  }

  /* ================= weather ================= */
  var WCODE = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Cloudy', 45: 'Fog', 48: 'Fog', 51: 'Drizzle', 53: 'Drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 80: 'Showers', 95: 'Thunderstorm' };
  function weather() {
    req('https://api.open-meteo.com/v1/forecast?latitude=' + CITY.lat + '&longitude=' + CITY.lon + '&current=temperature_2m,weather_code&timezone=auto',
      function (j) { var c = j.current; $('weather').textContent = Math.round(c.temperature_2m) + '°  ' + CITY.name + ' · ' + (WCODE[c.weather_code] || ''); });
  }

  /* ================= prayer times ================= */
  var PR = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
  var times = null, timesDay = '';
  function loadPrayers() {
    var d = new Date(), key = d.getDate() + '-' + (d.getMonth() + 1) + '-' + d.getFullYear();
    if (timesDay === key && times) return;
    req('https://api.aladhan.com/v1/timingsByCity/' + key + '?city=' + CITY.name + '&country=' + CITY.country + '&method=' + CITY.method,
      function (j) {
        times = j.data.timings; timesDay = key;
        try { var hj = j.data.date.hijri; $('hijri').textContent = hj.day + ' ' + hj.month.en + ' ' + hj.year + ' AH'; } catch (e) {}
        tick();
      }, function () { diag('pray', 'err'); });
  }
  function renderPrayers() {
    if (!times) return;
    var now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), nextIdx = -1, html = '';
    var mins = PR.map(function (p) { var s = (times[p] || '0:0').split(' ')[0].split(':'); return (+s[0]) * 60 + (+s[1]); });
    for (var i = 0; i < PR.length; i++) if (i !== 1 && mins[i] > nowMin) { nextIdx = i; break; }
    if (nextIdx === -1) nextIdx = 0;
    for (var k = 0; k < PR.length; k++) {
      var m = mins[k], left = '';
      if (k === nextIdx) { var diff = (m - nowMin + 1440) % 1440; left = '<span class="left">in ' + Math.floor(diff / 60) + 'h ' + pad(diff % 60) + 'm</span>'; }
      html += '<div class="pr' + (k === nextIdx ? ' next' : '') + '"><span>' + PR[k] + left + '</span><span class="t">' + fmt12(Math.floor(m / 60), m % 60) + '</span></div>';
    }
    $('prayers').innerHTML = html;
  }

  /* ================= apps ================= */
  var apps = [], favs = load(FAV_KEY, null), favsSaved = !!favs, svcOk = false;
  if (!favs) favs = [];
  function addApp(a) { for (var i = 0; i < apps.length; i++) if (apps[i].name.toLowerCase() === a.name.toLowerCase()) return; apps.push(a); }

  /* TizenBrew modules (TizenTube...) */
  var tbws = null;
  function loadModules(cb) {
    var done = false; function fin() { if (!done) { done = true; cb(); } }
    try {
      tbws = new WebSocket('ws://127.0.0.1:8081');
      tbws.onopen = function () { tbws.send(JSON.stringify({ type: 4, payload: false })); };
      tbws.onmessage = function (ev) {
        var msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.type === 4 && msg.payload) {
          for (var i = 0; i < msg.payload.length; i++) {
            var m = msg.payload[i];
            if (m && /amr-tv-home/.test(m.fullName || '') && m.serviceFile) { try { tbws.send(JSON.stringify({ type: 6, payload: m })); } catch (e) {} }
            if (!m || !m.appName || m.packageType === 'service' || /amr-tv-home/.test(m.fullName || '')) continue;
            addApp({ key: 'mod:' + m.fullName, name: /tizentube/i.test(m.fullName || '') ? 'YouTube (No Ads)' : m.appName, kind: 'module', module: m });
          }
          diag('mods', msg.payload.length); fin();
        }
      };
      tbws.onerror = fin; setTimeout(fin, 2500);
    } catch (e) { fin(); }
  }

  /* Installed TV apps via our background service (retries while it starts) */
  function loadService(cb, tries) {
    tries = tries || 0;
    req(SVC + '/apps', function (j) {
      if (!j.ok) { diag('svc', 'err ' + j.error); return cb(false); }
      var n = 0;
      for (var i = 0; i < j.apps.length; i++) {
        var a = j.apps[i];
        if (a.show === false || !a.name || HIDE.test(a.name) || !isUserApp(a)) continue;
        addApp({ key: 'app:' + a.id, name: a.name, kind: 'app', id: a.id, icon: a.icon ? SVC + '/icon?path=' + encodeURIComponent(a.icon) : '' }); n++;
      }
      svcOk = true; diag('svc', n); cb(n > 0);
    }, function () {
      if (tries < 10) return setTimeout(function () { loadService(cb, tries + 1); }, 1000);
      diag('svc', 'off'); cb(false);
    });
  }
  /* keep store/side-loaded apps, drop Samsung/Tizen system packages */
  function isUserApp(a) {
    var id = String(a.id || '');
    if (/^xvvl3S1bvH\./.test(id)) return false;               // TizenBrew itself
    if (/browser/i.test(id)) return true;                      // Internet
    if (/^\d{6,}/.test(id)) return true;                       // Samsung store apps
    return /^[A-Za-z0-9]{10}\.[A-Za-z]/.test(id);              // other installed web apps
  }
  function loadKnown() { for (var i = 0; i < KNOWN.length; i++) addApp({ key: 'known:' + KNOWN[i].name, name: KNOWN[i].name, kind: 'app', ids: KNOWN[i].ids }); diag('known', KNOWN.length); }

  /* ================= launching ================= */
  function launchIds(ids, i, name) {
    if (i >= ids.length) return toast('Could not open ' + name);
    if (svcOk) return req(SVC + '/launch?id=' + encodeURIComponent(ids[i]), function (j) { if (!j.ok) launchIds(ids, i + 1, name); }, function () { launchIds(ids, i + 1, name); });
    if (typeof tizen !== 'undefined' && tizen.application) {
      try { tizen.application.launch(ids[i], null, function () { launchIds(ids, i + 1, name); }); return; } catch (e) {}
    }
    launchIds(ids, i + 1, name);
  }
  function launch(item) {
    toast('Opening ' + item.name + '…');
    if (item.kind === 'module') {
      var m = item.module;
      try { for (var i = 0; i < (m.keys || []).length; i++) tizen.tvinputdevice.registerKey(m.keys[i]); } catch (e) {}
      try { tbws.send(JSON.stringify({ type: 5, payload: m })); } catch (e) {}
      if (!m.evaluateScriptOnDocumentStart && m.appPath) setTimeout(function () { location.href = m.appPath; }, 150);
      return;
    }
    launchIds(item.ids || [item.id], 0, item.name);
  }

  /* ================= rendering ================= */
  function byKey(k) { for (var i = 0; i < apps.length; i++) if (apps[i].key === k) return apps[i]; return null; }
  function makeTile(item, inFav) {
    var el = document.createElement('div');
    el.className = 'tile'; el.setAttribute('data-key', item.key); el.setAttribute('data-row', inFav ? 'fav' : 'all');
    var b = brandOf(item.name);
    el.style.background = 'linear-gradient(145deg, ' + b[1] + ', rgba(0,0,0,0.45))';
    var letter = document.createElement('div'); letter.className = 'letter'; letter.textContent = b[2] || item.name.charAt(0); el.appendChild(letter);
    var srcs = []; if (item.icon) srcs.push(item.icon); var lg = logoFor(item.name); if (lg) srcs.push(lg);
    (function tryNext(i) {
      if (i >= srcs.length) return;
      var img = new Image();
      img.onload = function () { if (img.naturalWidth < 32) return tryNext(i + 1); if (letter.parentNode) { el.replaceChild(img, letter); el.className += ' hasicon' + (i > 0 ? ' logo' : ''); } };
      img.onerror = function () { tryNext(i + 1); };
      img.src = srcs[i];
    })(0);
    var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = item.name; el.appendChild(nm);
    if (!inFav && favs.indexOf(item.key) !== -1) { var s = document.createElement('div'); s.className = 'star'; s.textContent = '★'; el.appendChild(s); }
    return el;
  }
  function render(keepKey, keepRow) {
    var fav = $('favTiles'), all = $('allTiles'); fav.innerHTML = ''; all.innerHTML = '';
    var shown = 0;
    for (var i = 0; i < favs.length; i++) { var it = byKey(favs[i]); if (it) { fav.appendChild(makeTile(it, true)); shown++; } }
    if (!shown) { var e = document.createElement('div'); e.id = 'empty'; e.textContent = 'Hold OK on any app below to pin it here'; fav.appendChild(e); }
    var sorted = apps.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    for (var j = 0; j < sorted.length; j++) all.appendChild(makeTile(sorted[j], false));
    var target = null, tiles = document.querySelectorAll('.tile');
    if (keepKey) for (var t = 0; t < tiles.length; t++) if (tiles[t].getAttribute('data-key') === keepKey && (!target || tiles[t].getAttribute('data-row') === keepRow)) target = tiles[t];
    focus(target || tiles[0]);
  }

  /* ================= navigation ================= */
  var cur = null;
  function focus(el) {
    if (!el) return;
    if (cur) cur.classList.remove('focused');
    cur = el; el.classList.add('focused');
    var rows = $('rows'), sc = $('scroller');
    var top = el.offsetTop, h = el.offsetHeight, view = rows.clientHeight;
    var t = -(parseFloat((sc.style.transform || '').replace(/[^-\d.]/g, '')) || 0);
    if (top - 60 < t) t = Math.max(0, top - 60);
    if (top + h + 30 > t + view) t = top + h + 30 - view;
    sc.style.transform = 'translateY(' + (-t) + 'px)';
    var it = byKey(el.getAttribute('data-key')), lb = $('label');
    if (it && el.className.indexOf("hasicon") !== -1 && el.className.indexOf("logo") === -1) {
      lb.textContent = it.name; lb.style.display = 'block';
      setTimeout(function () { lb.style.left = (el.offsetLeft + 40) + 'px'; lb.style.top = (el.offsetTop + el.offsetHeight + 30 - t) + 'px'; }, 0);
    } else lb.style.display = 'none';
  }
  function move(dir) {
    if (!cur) return focus(document.querySelector('.tile'));
    var r0 = cur.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
    var best = null, bestScore = Infinity, tiles = document.querySelectorAll('.tile');
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i]; if (t === cur) continue;
      var r = t.getBoundingClientRect(), dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy, main, cross;
      if (dir === 'left') { if (dx >= -5) continue; main = -dx; cross = Math.abs(dy); }
      else if (dir === 'right') { if (dx <= 5) continue; main = dx; cross = Math.abs(dy); }
      else if (dir === 'up') { if (dy >= -5) continue; main = -dy; cross = Math.abs(dx); }
      else { if (dy <= 5) continue; main = dy; cross = Math.abs(dx); }
      var score = main + cross * 2.5;
      if (score < bestScore) { bestScore = score; best = t; }
    }
    if (best) focus(best);
  }
  function toggleFav() {
    if (!cur) return;
    var k = cur.getAttribute('data-key'), row = cur.getAttribute('data-row'), it = byKey(k), idx = favs.indexOf(k);
    if (idx === -1) { favs.push(k); toast('★ Added ' + it.name + ' to favorites'); } else { favs.splice(idx, 1); toast('Removed from favorites'); }
    save(FAV_KEY, favs); favsSaved = true; render(k, row);
  }
  var okTimer = null, okLong = false;
  document.addEventListener('keydown', function (e) {
    switch (e.keyCode) {
      case 37: move('left'); break;
      case 39: move('right'); break;
      case 38: move('up'); break;
      case 40: move('down'); break;
      case 13: if (e.repeat || okTimer) break; okLong = false; okTimer = setTimeout(function () { okLong = true; toggleFav(); }, 700); break;
      case 403: toggleFav(); break;
      case 10009: try { tizen.application.getCurrentApplication().hide(); } catch (err) {} break;
      default: return;
    }
    e.preventDefault();
  });
  document.addEventListener('keyup', function (e) {
    if (e.keyCode !== 13) return;
    if (okTimer) { clearTimeout(okTimer); okTimer = null; }
    if (!okLong && cur) { var it = byKey(cur.getAttribute('data-key')); if (it) launch(it); }
    okLong = false;
  });

  /* ================= boot ================= */
  function defaultFavs() {
    var out = [];
    for (var i = 0; i < DEFAULT_FAVS.length; i++)
      for (var j = 0; j < apps.length; j++)
        if (apps[j].name.toLowerCase().indexOf(DEFAULT_FAVS[i]) !== -1 && out.indexOf(apps[j].key) === -1) { out.push(apps[j].key); break; }
    return out.slice(0, 6);
  }
  tick(); setInterval(tick, 15000);
  weather(); setInterval(weather, 30 * 60 * 1000);
  loadPrayers(); setInterval(loadPrayers, 60 * 60 * 1000);
  loadModules(function () {
    render();
    loadService(function (ok) {
      if (!ok) loadKnown();
      if (!favsSaved) { favs = defaultFavs(); if (svcOk) { save(FAV_KEY, favs); favsSaved = true; } }
      render();
    });
  });
})();
</script>
</body>
</html>
